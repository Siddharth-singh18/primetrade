version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: taskflow-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: taskflow
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://root:example@mongodb:27017/taskflow?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_key_change_me
      - JWT_REFRESH_SECRET=super_secret_refresh_key_change_me
      - CORS_ORIGIN=http://localhost:3001
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    ports:
      - '3001:3000'
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
